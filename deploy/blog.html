<script>
var POSTS = [
  {
    slug:"first-time", cat:"教程", emoji:"🧸", grad:"linear-gradient(135deg,#F2643E,#F4C041)",
    title:"新手第一次拼豆，怎么不翻车？",
    date:"2026-07-18", excerpt:"从选图到烫合，5 个步骤带你稳稳完成第一块豆画，避开最常见的几个坑。",
    body:"<p>拼豆（Perler Beads / Hama Beads）上手其实很快，但第一次容易在细节上翻车。下面这 5 步能帮你一次成功。</p>"+
         "<h2>1. 先选一个中等尺寸</h2><p>别一上来就挑战 50×50 的大图。<b>29×29 或 39×39</b> 是最适合新手的尺寸，既能看出图案，又不会数到眼花。</p>"+
         "<h2>2. 用图纸，不要凭记忆</h2><p>在像素豆生成器里下载方格图纸，对着配色图例一颗颗放。图例会告诉你每种颜色用了多少颗，放之前先核对一遍。</p>"+
         "<h2>3. 熨烫是关键</h2><p>熨斗调到<b>中低温、无蒸汽</b>，隔一层烘焙纸轻轻压，让珠子表面微微熔化、彼此粘连即可，别压太久否则会塌。</p>"+
         "<h2>4. 翻面再烫一次</h2><p>翻过来在背面也烫一下，豆画会更平整、更结实，挂起来也不容易弯。</p>"+
         "<h2>5. 压平定型</h2><p>烫完趁热用厚书压几分钟，冷却后基本不会翘边。</p>"+
         "<p>完成！把第一块作品拍下来，去 <a href='community.html' style='color:var(--orange);font-weight:600'>作品社区</a> 找找灵感吧。</p>"
  },
  {
    slug:"color-12", cat:"配色", emoji:"🎨", grad:"linear-gradient(135deg,#1FA89A,#F2643E)",
    title:"12 色色板怎么选？配色避坑指南",
    date:"2026-07-15", excerpt:"为什么你的图生成后发灰？聊聊量化配色里的取舍，以及怎么让作品更亮眼。",
    body:"<p>像素豆默认用官方 12 色色板。把一张彩色照片量化到 12 色，必然要做取舍，这也是很多作品「发灰」的原因。</p>"+
         "<h2>先保证主体对比</h2><p>人脸、动物这类主体，尽量保留<b>高光与暗部</b>两档，否则会像被洗掉了一层。生成器里可以切换配色方案预览，挑对比最强的那一版。</p>"+
         "<h2>慎用相近色</h2><p>米白和浅黄、深蓝和黑，放在一起容易糊成一团。如果图里这两种都重要，适当放大主体、弱化背景。</p>"+
         "<h2>用强调色点睛</h2><p>在平淡的图上加一颗亮橙或亮绿做眼睛、做点缀，整幅画立刻有了神。这也是模板库里很多作品的小心机。</p>"+
         "<p>想自己调？去 <a href='palette.html' style='color:var(--orange);font-weight:600'>色板</a> 页看看 12 色分别长什么样。</p>"
  },
  {
    slug:"gift-ideas", cat:"灵感", emoji:"💝", grad:"linear-gradient(135deg,#F4C041,#1FA89A)",
    title:"5 个一眼就爱的拼豆礼物灵感",
    date:"2026-07-12", excerpt:"生日、纪念日、乔迁，拼豆做的礼物既有心意又便宜，这 5 个方向闭眼送。",
    body:"<p>亲手拼的礼物，比买来的更有温度。这 5 个方向都不挑技术，新手也能拼得好看。</p>"+
         "<ul><li><b>宠物头像：</b>把对方的猫/狗做成钥匙扣或冰箱贴。</li>"+
         "<li><b>名字首字母：</b>用字母模板拼出对方名字，做成挂饰。</li>"+
         "<li><b>最爱角色：</b>动漫/游戏里的小角色，谁收到都会笑。</li>"+
         "<li><b>爱心 / 星星：</b>经典不出错，配个小磁贴就能上 fridge。</li>"+
         "<li><b>小风景：</b>日落、雪山，做成立体摆件很有质感。</li></ul>"+
         "<p>缺灵感就去 <a href='templates.html' style='color:var(--orange);font-weight:600'>模板库</a> 挑一个现成的。</p>"
  },
  {
    slug:"material-101", cat:"科普", emoji:"🔬", grad:"linear-gradient(135deg,#241E18,#6E655A)",
    title:"拼豆材质科普：普通珠 vs 夜光珠",
    date:"2026-07-08", excerpt:"除了最常见的塑料熔珠，还有夜光、珍珠、透明……这些材质差别在哪？一篇讲清。",
    body:"<p>拼豆珠子按材质主要分几类，各有性格：</p>"+
         "<h2>普通熔珠（PE）</h2><p>最常见，熨烫后熔化粘连，便宜耐造，适合绝大多数作品。</p>"+
         "<h2>夜光珠</h2><p>吸光后能在暗处发光，做星空、萤火虫特别出片，但颜色选择少、亮度会衰减。</p>"+
         "<h2>珍珠 / 磨砂珠</h2><p>表面哑光、有珠光感，适合做首饰、摆件，质感更高级。</p>"+
         "<h2>透明珠</h2><p>透光，做窗户、冰块之类有奇效，但拼的时候容易看错位置，新手慎选。</p>"+
         "<p>tip：混材质时先在小样上试烫，不同熔点的珠子熨烫时间不一样。</p>"
  },
  {
    slug:"pick-photo", cat:"教程", emoji:"📷", grad:"linear-gradient(135deg,#F2643E,#1FA89A)",
    title:"用照片做拼豆，选图有讲究",
    date:"2026-07-03", excerpt:"同一张照片，选得好坏决定成品上限。4 个选图原则让生成效果立刻提升。",
    body:"<p>照片转拼豆，选图比后期更重要。记住这 4 点：</p>"+
         "<ul><li><b>主体大、留白少：</b>人脸占画面 60% 以上最好认。</li>"+
         "<li><b>边缘清晰：</b>模糊的图量化后会糊成一团。</li>"+
         "<li><b>明暗分明：</b>避免大面积同色，否则细节丢失。</li>"+
         "<li><b>少文字：</b>小字在 12 色下基本会变成噪点。</li></ul>"+
         "<p>上传前可以先在 <a href='color.html' style='color:var(--orange);font-weight:600'>智能取色</a> 里试量化，看看效果再决定。</p>"
  },
  {
    slug:"storage", cat:"科普", emoji:"📦", grad:"linear-gradient(135deg,#1FA89A,#F4C041)",
    title:"拼豆收纳与展示的小妙招",
    date:"2026-06-28", excerpt:"珠子越买越多怎么收？做好的作品怎么摆？几个低成本实用办法。",
    body:"<p>入坑之后，珠子和作品都会越来越多，收纳和展示是个问题。</p>"+
         "<h2>珠子收纳</h2><p>按色分到带格的收纳盒，贴好色名标签。常用的 12 色放在手边一格，拼的时候不用满世界找。</p>"+
         "<h2>作品展示</h2><p>小的做成磁贴贴冰箱；中的装相框挂墙；大的用无痕钉或立式亚克力架。夜光作品放床头，关灯超治愈。</p>"+
         "<h2>防翘边</h2><p>长期挂着的作品如果翘边，背面贴一小块双面胶或软磁条就能压平。</p>"
  }
];

var listView = document.getElementById('listView');
var reader = document.getElementById('reader');
var currentCat = '全部';

function renderList(){
  var pool = POSTS.filter(function(p){ return currentCat==='全部' || p.cat===currentCat; });
  var featureSlot = document.getElementById('featureSlot');
  var cardGrid = document.getElementById('cardGrid');
  featureSlot.innerHTML = '';
  cardGrid.innerHTML = '';
  if(pool.length){
    var f = pool[0];
    featureSlot.innerHTML =
      '<div class="feature" data-slug="'+f.slug+'">'+
        '<div class="cover" style="background:'+f.grad+'">'+f.emoji+'</div>'+
        '<div class="body"><div class="tag">'+f.cat+' · 精选</div><h2>'+f.title+'</h2>'+
        '<p>'+f.excerpt+'</p><div class="meta">'+f.date+'</div></div></div>';
    pool.slice(1).forEach(function(p){
      cardGrid.innerHTML +=
        '<div class="card" data-slug="'+p.slug+'">'+
          '<div class="cover" style="background:'+p.grad+'">'+p.emoji+'</div>'+
          '<div class="body"><div class="tag">'+p.cat+'</div><h3>'+p.title+'</h3>'+
          '<p>'+p.excerpt+'</p><div class="meta">'+p.date+'</div></div></div>';
    });
  }
  document.querySelectorAll('[data-slug]').forEach(function(el){
    el.addEventListener('click', function(){ openPost(el.getAttribute('data-slug')); });
  });
}

function openPost(slug){
  var p = POSTS.find(function(x){ return x.slug===slug; });
  if(!p) return;
  document.getElementById('rCover').style.background = p.grad;
  document.getElementById('rCover').textContent = p.emoji;
  document.getElementById('rTitle').textContent = p.title;
  document.getElementById('rMeta').textContent = p.cat + ' · ' + p.date;
  document.getElementById('rContent').innerHTML = p.body;
  listView.style.display = 'none';
  reader.style.display = 'block';
  window.scrollTo(0,0);
  if(history && history.replaceState) history.replaceState(null,'','#'+slug);
}

document.getElementById('backBtn').addEventListener('click', function(){
  reader.style.display = 'none';
  listView.style.display = 'block';
  if(history && history.replaceState) history.replaceState(null,'','blog.html');
  window.scrollTo(0,0);
});

document.getElementById('filters').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#filters button').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  currentCat = b.getAttribute('data-cat');
  renderList();
});

(function(){
  var hash = (location.hash||'').replace('#','');
  renderList();
  if(hash){ var p = POSTS.find(function(x){ return x.slug===hash; }); if(p) openPost(hash); }
})();
</script>
